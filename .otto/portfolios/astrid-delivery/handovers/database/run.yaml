mode: planning_only
roles:
  coordinator: {model: gpt-5.6-luna, reasoning: medium}
  worker_normal: {model: gpt-5.6-luna, reasoning: high}
  worker_xhard: {model: gpt-5.6-sol, reasoning: high}
  reviewer_normal: {model: gpt-5.6-luna, reasoning: medium}
  reviewer_xhard: {model: gpt-5.6-sol, reasoning: high}
  oracle: {model: gpt-5.6-sol, reasoning: high}
  final_reviewer: {model: gpt-6-astra, reasoning: medium}
oracle:
  max_calls: 3
# Dormant until delivery is authorized. One foundation boundary catches admission
# and transaction mistakes before snapshot/recovery and callers build on them.
# Final review covers integrated lifecycle and consumers; no redundant late gate.
review_stages:
  - id: foundation
    after: T3
    reviewer_role: reviewer_normal
    lens: completion
    scope_tasks: [T1, T2, T3]
    criteria_source: implementation-criteria.md
    criteria: [C1, C2, C3]
    max_rounds: 2
  - id: final
    after: T7
    reviewer_role: final_reviewer
    lens: completion_and_strategy
    scope_tasks: [T1, T2, T3, T4, T5, T6, T7]
    criteria_source: implementation-criteria.md
    criteria: [C1, C2, C3, C4, C5, C6, C7, C8]
    max_rounds: 3
